<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>美食雷達 | 尋找附近好料</title> <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        display: ['"Fredoka"', 'sans-serif'],
                    },
                    colors: {
                        radar: { // 顏色名稱改通用一點，但色碼維持活潑色調
                            orange: '#FF8C42',
                            yellow: '#FFC857',
                            blue: '#4AD7D1',
                            red: '#FF5A5F',
                            bg: '#FFF9F0'
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .blob {
            position: fixed;
            filter: blur(40px);
            z-index: 0;
            opacity: 0.6;
            pointer-events: none;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #FF8C42; border-radius: 4px; opacity: 0.5; }
        ::-webkit-scrollbar-thumb:hover { background: #FF5A5F; }
    </style>
</head>
<body class="bg-radar-bg text-gray-700 h-screen flex flex-col overflow-hidden relative selection:bg-radar-orange selection:text-white">

    <div class="blob w-64 h-64 bg-radar-yellow rounded-full top-[-50px] left-[-50px] animate-float" style="animation-delay: 0s;"></div>
    <div class="blob w-80 h-80 bg-radar-blue rounded-full bottom-[-80px] right-[-40px] animate-float" style="animation-delay: 2s;"></div>

    <header class="z-50 bg-white/80 backdrop-blur-lg shadow-sm fixed w-full top-0 left-0 px-4 py-3 border-b border-white/50">
        <div class="flex justify-between items-center max-w-2xl mx-auto">
            <div class="flex items-center gap-2 cursor-pointer hover:opacity-80 transition-opacity" onclick="location.reload()">
                <span class="text-3xl filter drop-shadow-sm">📡</span>
                <div>
                    <h1 class="text-2xl font-display font-bold text-transparent bg-clip-text bg-gradient-to-r from-radar-orange to-radar-red tracking-wide">Food Radar</h1>
                    <p class="text-[10px] text-gray-500 font-bold bg-white/50 px-2 py-0.5 rounded-full inline-block">尋找附近美食</p>
                </div>
            </div>
            <button onclick="resetApp()" class="text-gray-400 hover:text-radar-orange transition-colors p-2 rounded-full hover:bg-gray-100">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
        </div>
    </header>

    <main class="flex-grow pt-28 pb-10 px-4 z-10 max-w-2xl mx-auto w-full overflow-y-auto relative" id="main-content">
        
        <div id="category-view" class="animate-pop pb-10">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-1">今天想吃哪一類？</h2>
                <p class="text-gray-500 text-sm">搜尋目前位置附近的餐廳</p>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <button onclick="showSubMenu('chinese')" class="group bg-white p-6 rounded-2xl shadow-lg shadow-orange-100 hover:shadow-orange-200 border-2 border-transparent hover:border-radar-orange transition-all duration-200 transform hover:-translate-y-1 active:scale-95">
                    <div class="text-4xl mb-3 group-hover:scale-110 transition-transform">🍜</div>
                    <div class="font-bold text-lg text-gray-700">中式/小吃</div>
                </button>
                <button onclick="showSubMenu('western')" class="group bg-white p-6 rounded-2xl shadow-lg shadow-blue-100 hover:shadow-blue-200 border-2 border-transparent hover:border-radar-blue transition-all duration-200 transform hover:-translate-y-1 active:scale-95">
                    <div class="text-4xl mb-3 group-hover:scale-110 transition-transform">🍔</div>
                    <div class="font-bold text-lg text-gray-700">西式/異國</div>
                </button>
                <button onclick="showSubMenu('cafe')" class="group bg-white p-6 rounded-2xl shadow-lg shadow-yellow-100 hover:shadow-yellow-200 border-2 border-transparent hover:border-radar-yellow transition-all duration-200 transform hover:-translate-y-1 active:scale-95">
                    <div class="text-4xl mb-3 group-hover:scale-110 transition-transform">🍰</div>
                    <div class="font-bold text-lg text-gray-700">甜點咖啡</div>
                </button>
                <button onclick="showSubMenu('drinks')" class="group bg-white p-6 rounded-2xl shadow-lg shadow-teal-100 hover:shadow-teal-200 border-2 border-transparent hover:border-teal-400 transition-all duration-200 transform hover:-translate-y-1 active:scale-95">
                    <div class="text-4xl mb-3 group-hover:scale-110 transition-transform">🍹</div>
                    <div class="font-bold text-lg text-gray-700">解渴手搖</div>
                </button>
                <button onclick="showSubMenu('late_night')" class="group bg-white p-6 rounded-2xl shadow-lg shadow-purple-100 hover:shadow-purple-200 border-2 border-transparent hover:border-purple-400 transition-all duration-200 transform hover:-translate-y-1 active:scale-95">
                    <div class="text-4xl mb-3 group-hover:scale-110 transition-transform">🍢</div>
                    <div class="font-bold text-lg text-gray-700">宵夜場</div>
                </button>
                <button onclick="startLocationSearch('surprise')" class="group bg-gradient-to-br from-radar-orange to-radar-red p-6 rounded-2xl shadow-lg shadow-red-200 hover:shadow-red-300 text-white transition-all duration-200 transform hover:-translate-y-1 active:scale-95">
                    <div class="text-4xl mb-3 animate-pulse">🎲</div>
                    <div class="font-bold text-lg">幫我決定！</div>
                    <div class="text-xs text-white/80 mt-1">全隨機</div>
                </button>
            </div>
        </div>

        <div id="submenu-view" class="hidden animate-pop pb-20">
            <div class="flex items-center mb-6 sticky top-0 bg-radar-bg/95 backdrop-blur py-2 z-10">
                <button onclick="resetApp()" class="mr-4 bg-white p-2 rounded-full shadow text-gray-500 hover:text-radar-orange transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
                <div>
                    <h2 class="text-2xl font-bold text-gray-800" id="submenu-title">選擇細項</h2>
                    <p class="text-gray-500 text-sm">想吃具體哪一種？</p>
                </div>
            </div>

            <div id="submenu-container" class="grid grid-cols-2 gap-3"></div>
        </div>

        <div id="loading-view" class="hidden fixed inset-0 bg-radar-bg z-30 flex flex-col items-center justify-center pt-20">
            <div class="relative w-32 h-32 mb-8">
                <div class="absolute inset-0 border-4 border-radar-orange/20 rounded-full animate-ping"></div>
                <div class="absolute inset-0 border-4 border-radar-orange/40 rounded-full" style="animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;"></div>
                <div class="absolute inset-0 flex items-center justify-center text-5xl animate-bounce">📍</div>
            </div>
            <h3 class="text-2xl font-bold text-gray-800 mb-2">正在鎖定你的位置...</h3>
            <p id="loading-text" class="text-radar-orange font-bold text-lg animate-pulse">搜尋中...</p>
            <p class="text-xs text-gray-400 mt-8 max-w-xs text-center">請允許瀏覽器存取位置，我們將為你導航至最近的 Google Maps 結果。</p>
            <button onclick="location.reload()" class="mt-8 px-6 py-2 bg-white border border-gray-300 rounded-full text-sm text-gray-500 hover:bg-gray-50">如果卡住請點此重新整理</button>
        </div>

    </main>

    <script>
        // ==========================================
        // ★ 通用版關鍵字資料庫 (移除了 "台南") ★
        // ==========================================
        const KEYWORDS = {
            'chinese': [
                '牛肉麵', '肉燥飯', '鱔魚意麵', 
                '鍋燒意麵', '米糕', '虱目魚', 
                '熱炒', '火鍋', '粥', 
                '麵店', '便當', '健康餐盒', '水餃', '炒飯'
            ],
            'western': ['漢堡', '義大利麵', '牛排', '披薩', '早午餐', '日式料理', '咖哩', '拉麵', '壽司', '韓式料理', '泰式料理'],
            'cafe': ['咖啡廳', '甜點', '蛋糕', '冰店', '豆花', '下午茶', '布丁', '舒芙蕾'],
            'drinks': ['手搖飲料', '果汁', '紅茶', '綠豆沙', '楊枝甘露', '珍珠奶茶'],
            'late_night': ['鹹酥雞', '燒烤', '串燒', '宵夜', '居酒屋', '滷味', '豆漿']
        };

        const CATEGORY_NAMES = {
            'chinese': '🍜 中式美食',
            'western': '🍔 西式料理',
            'cafe': '🍰 甜點咖啡',
            'drinks': '🍹 手搖飲料',
            'late_night': '🍢 宵夜時光'
        };

        const ALL_KEYWORDS = [].concat(...Object.values(KEYWORDS));

        function showSubMenu(category) {
            const categoryView = document.getElementById('category-view');
            const submenuView = document.getElementById('submenu-view');
            const container = document.getElementById('submenu-container');

            if (!categoryView || !submenuView || !container) return;

            categoryView.classList.add('hidden');
            submenuView.classList.remove('hidden');
            
            document.getElementById('main-content').scrollTop = 0;
            
            document.getElementById('submenu-title').innerText = CATEGORY_NAMES[category];
            container.innerHTML = ''; 

            const randomBtn = document.createElement('button');
            randomBtn.className = "col-span-2 bg-gradient-to-r from-gray-700 to-gray-800 text-white p-4 rounded-xl shadow-lg font-bold flex justify-center items-center gap-2 transform active:scale-95 transition-all hover:shadow-xl";
            randomBtn.innerHTML = "🎲 隨便，這類都可以";
            randomBtn.onclick = () => startLocationSearch(category, true); 
            container.appendChild(randomBtn);

            if (KEYWORDS[category]) {
                KEYWORDS[category].forEach(keyword => {
                    const btn = document.createElement('button');
                    // 因為已經拿掉 "台南" 了，所以這裡直接顯示關鍵字即可
                    btn.className = "bg-white border border-gray-200 p-4 rounded-xl shadow-sm hover:shadow-md hover:border-radar-orange font-bold text-gray-700 text-lg transition-all active:scale-95 active:bg-orange-50";
                    btn.innerText = keyword;
                    btn.onclick = () => startLocationSearch(keyword, false); 
                    container.appendChild(btn);
                });
            }
        }

        function startLocationSearch(param, isRandomCategory) {
            document.getElementById('category-view').classList.add('hidden');
            document.getElementById('submenu-view').classList.add('hidden');
            document.getElementById('loading-view').classList.remove('hidden');

            let searchKeyword = '';
            let displayText = '';

            if (param === 'surprise') {
                searchKeyword = ALL_KEYWORDS[Math.floor(Math.random() * ALL_KEYWORDS.length)];
                displayText = `命運選中了... ${searchKeyword}！`;
            } else if (isRandomCategory) {
                const list = KEYWORDS[param];
                searchKeyword = list[Math.floor(Math.random() * list.length)];
                displayText = `正在隨機搜尋... ${searchKeyword}`;
            } else {
                searchKeyword = param;
                displayText = `正在搜尋附近的... ${searchKeyword}`;
            }

            document.getElementById('loading-text').innerText = displayText;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        setTimeout(() => {
                            openGoogleMaps(searchKeyword, lat, lng);
                            setTimeout(() => resetApp(), 1000); 
                        }, 800);
                    },
                    (error) => {
                        console.error("Geolocation Error:", error);
                        let errorMsg = "無法取得位置。";
                        if(error.code === 1) errorMsg = "您拒絕了位置存取權限。";
                        
                        // 失敗時不再鎖定台南，而是單純用關鍵字搜尋（Google 會自己猜位置，或者搜出全台有名的）
                        alert(errorMsg + "\n將直接為您開啟 Google Maps 搜尋。");
                        
                        // 移除經緯度鎖定，改為通用搜尋
                        const url = `https://www.google.com/maps/search/${encodeURIComponent(searchKeyword)}`;
                        window.open(url, '_blank');
                        resetApp();
                    }
                );
            } else {
                alert("你的瀏覽器不支援定位功能。");
                const url = `https://www.google.com/maps/search/${encodeURIComponent(searchKeyword)}`;
                window.open(url, '_blank');
            }
        }

        function openGoogleMaps(keyword, lat, lng) {
            // 這邊的關鍵是：關鍵字本身不再有縣市名稱，而是完全依賴 lat, lng 來決定搜尋範圍
            const url = `https://www.google.com/maps/search/${encodeURIComponent(keyword)}/@${lat},${lng},15z`;
            window.open(url, '_blank');
        }

        function resetApp() {
            document.getElementById('loading-view').classList.add('hidden');
            document.getElementById('submenu-view').classList.add('hidden');
            document.getElementById('category-view').classList.remove('hidden');
            document.getElementById('main-content').scrollTop = 0;
        }
    </script>
</body>
</html>
