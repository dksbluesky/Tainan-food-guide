<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>美食雷達 | 尋找附近好料</title> <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        display: ['"Fredoka"', 'sans-serif'],
                    },
                    colors: {
                        radar: { // 顏色名稱改通用一點，但色碼維持活潑色調
                            orange: '#FF8C42',
                            yellow: '#FFC857',
                            blue: '#4AD7D1',
                            red: '#FF5A5F',
                            bg: '#FFF9F0'
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .blob {
            position: fixed;
            filter: blur(40px);
            z-index: 0;
            opacity: 0.6;
            pointer-events: none;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #FF8C42; border-radius: 4px; opacity: 0.5; }
        ::-webkit-scrollbar-thumb:hover { background: #FF5A5F; }
    </style>
</head>
<body class="bg-radar-bg text-gray-700 h-screen flex flex-col overflow-hidden relative selection:bg-radar-orange selection:text-white">

    <div class="blob w-64 h-64 bg-radar-yellow rounded-full top-[-50px] left-[-50px] animate-float" style="animation-delay: 0s;"></div>
    <div class="blob w-80 h-80 bg-radar-blue rounded-full bottom-[-80px] right-[-40px] animate-float" style="animation-delay: 2s;"></div>

    <header class="z-50 bg-white/80 backdrop-blur-lg shadow-sm fixed w-full top-0 left-0 px-4 py-3 border-b border-white/50">
        <div class="flex justify-between items-center max-w-2xl mx-auto">
            <div class="flex items-center gap-2 cursor-pointer hover:opacity-80 transition-opacity" onclick="location.reload()">
                <span class="text-3xl filter drop-shadow-sm">📡</span>
                <div>
                    <h1 class="text-2xl font-display font-bold text-transparent bg-clip-text bg-gradient-to-r from-radar-orange to-radar-red tracking-wide">Food Radar</h1>
                    <p class="text-[10px] text-gray-500 font-bold bg-white/50 px-2 py-0.5 rounded-full inline-block">尋找附近美食</p>
                </div>
            </div>
            <button onclick="resetApp()" class="text-gray-400 hover:text-radar-orange transition-colors p-2 rounded-full hover:bg-gray-100">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
        </div>
    </header>

    <main class="flex-grow pt-28 pb-10 px-4 z-10 max-w-2xl mx-auto w-full overflow-y-auto relative" id="main-content">
        
        <div id="category-view" class="animate-pop pb-10">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-1">今天想吃哪一類？</h2>
                <p class="text-gray-500 text-sm">搜尋目前位置附近的餐廳</p>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <button onclick="showSubMenu('chinese')" class="group bg-white p-6 rounded-2xl shadow-lg shadow-orange-100 hover:shadow-orange-200 border-2 border-transparent hover:border-radar-orange transition-all duration-200 transform hover:-translate-y-1 active:scale-95">
                    <div class="text-4xl mb-3 group-hover:scale-110 transition-transform">🍜</div>
                    <div class="font-bold text-lg text-gray-700">中式/小吃</div>
                </button>
                <button onclick="showSubMenu('western')" class="group bg-white p-6 rounded-2xl shadow-lg shadow
