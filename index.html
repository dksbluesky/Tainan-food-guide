    <script>
        // =========================================================
        // ★ 已內建您的 Google Sheet 連結 ★
        // =========================================================
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQXPhZ5z3CHn6oemAKkuUuDskGkk6CLfbfNws0s2QL2UQTo6TOIP9kzuOqx5vB8hU_SXF_-ObxsK0h0/pub?gid=1932764462&single=true&output=csv'; 
        // =========================================================

        let FOOD_DATA = [];

        window.onload = function() {
            fetchDataFromSheet();
        };

        // --- 1. 抓取雲端資料 ---
        async function fetchDataFromSheet() {
            document.getElementById('header-status').innerText = "雲端同步中...";
            try {
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error("Network response was not ok");
                const csvText = await response.text();
                parseCSV(csvText);
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('header-status').innerText = "連線失敗";
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n');
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const cleanLine = line.replace(/"/g, ''); 
                const parts = cleanLine.split(',');
                if (parts.length >= 2) {
                    result.push({
                        name: parts[0].trim(),
                        cat: parts[1] ? parts[1].trim() : 'unclass',
                        addr: parts[2] ? parts[2].trim() : '台南市',
                        note: parts[3] ? parts[3].trim() : ''
                    });
                }
            }
            updateApp(result, "雲端資料");
        }

        // --- 2. 轉檔功能 ---
        function handleFileUpload(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const parsed = parseLineChat(text);
                
                if (parsed.length > 0) {
                    // 立即更新 App
                    updateApp(parsed, "本機暫存 (TXT)");
                    
                    document.getElementById('upload-status').classList.remove('hidden');
                    document.getElementById('new-count').innerText = parsed.length;
                    
                    alert(`✅ 轉檔成功！\n\n您的手機畫面已更新。\n請記得下載 CSV 並到 Google Drive 使用「匯入」功能更新雲端。`);
                } else {
                    alert("讀取失敗，請確認檔案格式。");
                }
            };
            reader.readAsText(file);
        }

        function parseLineChat(text) {
            const lines = text.split('\n');
            const results = [];
            
            // ★ 2025/01/24 更新：超級關鍵字資料庫
            const keywords = {
                'chinese': [
                    '麵', '飯', '粥', '餃', '湯', '餅', '肉燥', '熱炒', '火鍋', '砂鍋', 
                    '鴨', '雞', '米糕', '便當', '快餐', '小吃', '壽司', '日料', '丼', '牛排', 
                    '羹', '饅頭', '碗粿', '肉圓', '刈包', '水煎包', '擔仔麵', '鱔魚', '鵝肉',
                    '牛肉', '羊肉', '滷味', '食堂', '燒肉飯', '腿庫', '排骨', '意麵', '扁食'
                ], 
                'western': [
                    '漢堡', '義大利', '披薩', 'Pizza', 'Pasta', '牛排', '韓式', '泰式', '港式', 
                    '燒肉', '越式', '美式', '異國', '咖哩', 'Curry', 'Burger', 'Bistro', '餐酒館',
                    '日式', '鐵板燒'
                ],
                'cafe': [
                    '咖啡', 'Cafe', '甜點', '蛋糕', '冰', '豆花', '早午餐', 'Brunch', '麵包', 
                    '烘焙', '甜甜圈', '鬆餅', '布丁', '蜜餞', '伴手禮', '麻糬', 'Coffee', '下午茶'
                ],
                'drinks': [
                    '茶', '飲', '奶', '果汁', '紅茶', '綠茶', '手搖', '飲料'
                ],
                'healthy': [
                    '健康', '低卡', '舒肥', '餐盒', '水煮', '輕食', 'Poke', '沙拉', 'Diet'
                ],
                'late_night': [
                    '燒烤', '串燒', '鹹酥雞', '炸雞', '居酒屋', '宵夜', '鹽酥雞', '雞排', '烤玉米'
                ]
            };

            lines.forEach((line, index) => {
                line = line.trim();
                if (!line) return;
                
                // 1. 偵測 Google Maps 連結
                const mapLinkMatch = line.match(/https:\/\/(g\.co\/kgs\/|share\.google\/|goo\.gl\/maps)[a-zA-Z0-9_]+/);
                // 2. 偵測地址 (有些對話只有地址)
                const addrMatch = line.match(/台南市\S+(區|路|街|巷)\S+/);

                // 只有當這行是「連結」或「地址」時，才觸發「找店名」的動作
                if (mapLinkMatch || addrMatch) {
                    let name = "";
                    let rawName = "";
                    
                    // ★ 修正：往上找 10 行 (範圍加大)
                    for (let i = 1; i <= 10; i++) {
                        const prevLine = lines[index - i];
                        if (!prevLine) continue;

                        // 移除 LINE 時間戳記 (例如: "21:23 嘟 ")
                        let cleanLine = prevLine.replace(/^\d{2}:\d{2}\s+\S+\s+/, '').trim();
                        
                        // ★ 關鍵過濾：跳過不像店名的行
                        // 1. 跳過日期 (2025.01.01 星期三)
                        if (cleanLine.match(/^\d{4}\.\d{2}\.\d{2}/)) continue;
                        // 2. 跳過網址
                        if (cleanLine.includes('http')) continue;
                        // 3. 跳過電話 (06 221 3065 或 09xx-xxx-xxx)
                        if (cleanLine.match(/^[\d\-\s\(\)]{8,}$/)) continue;
                        // 4. 跳過營業時間/公休 (包含 "週一" "時間" "休息" "公休" 等字)
                        if (cleanLine.match(/(週|星期|時間|公休|休息|營業|address|tel|phone|open)/i)) continue;
                        // 5. 跳過地址行 (如果地址上面那行還是地址，就再往上找)
                        if (cleanLine.match(/台南市\S+(區|路|街|巷)/)) continue;
                        // 6. 如果這行是 "店家名稱:"，直接抓後面的字
                        if (cleanLine.match(/^(店家名稱|店名)[:：]/)) {
                            name = cleanLine.replace(/^(店家名稱|店名)[:：]\s*/, '').trim();
                            break;
                        }

                        // 如果通過以上所有過濾，且長度適中，這應該就是店名了！
                        if (cleanLine.length > 1 && cleanLine.length < 30) { 
                            name = cleanLine;
                            break;
                        }
                    }
                    
                    // 如果往上 10 行都沒找到，最後的手段：
                    // 檢查「當前行」是否包含店名 (有些格式是: 店名 https://...)
                    if (!name) {
                        let currentClean = line.replace(/https:\/\/.*$/, '').replace(/^\d{2}:\d{2}\s+\S+\s+/, '').trim();
                        // 確保當前行不是地址，才把它當店名
                        if (currentClean && !currentClean.match(/台南市\S+(區|路|街|巷)/)) {
                            name = currentClean;
                        }
                    }

                    // 還是沒名字？那就標示為未命名，避免把地址當店名
                    if (!name) name = "未命名餐廳";

                    // 格式整理
                    name = name.replace(/,/g, ' ').replace(/，/g, ' ').trim(); 
                    const address = addrMatch ? addrMatch[0] : "台南市 (詳見地圖)";
                    
                    // 自動分類
                    let category = 'unclass';
                    const checkStr = name + address;
                    
                    if (checkStr.includes('健康') || checkStr.includes('餐盒') || checkStr.includes('舒肥')) category = 'healthy';
                    else if (checkStr.match(/咖啡|甜點|蛋糕|冰|豆花|早午餐|Brunch/i)) category = 'cafe';
                    else if (checkStr.match(/燒烤|串燒|炸雞|鹹酥雞|居酒屋/)) category = 'late_night';
                    else if (checkStr.match(/茶|飲|奶|果汁/)) category = 'drinks';
                    else {
                        for (const [cat, keys] of Object.entries(keywords)) {
                            if (keys.some(k => checkStr.includes(k))) {
                                category = cat;
                                break;
                            }
                        }
                    }
                    
                    // 儲存結果 (防止重複)
                    // 如果已經存過這個地址，就跳過 (避免連結跟地址重複抓)
                    if (!results.some(r => r.name === name || (r.addr === address && r.addr !== "台南市 (詳見地圖)"))) {
                        results.push({ name, cat: category, addr: address, note: "" });
                    }
                }
            });
            return results;
        }

        // --- 3. 更新 App 狀態 ---
        function updateApp(newData, sourceLabel) {
            FOOD_DATA = newData;
            document.getElementById('total-count').innerText = `${FOOD_DATA.length} 間`;
            document.getElementById('header-status').innerText = `已載入: ${FOOD_DATA.length} 間`;
            document.getElementById('source-label').innerText = sourceLabel;
            
            if (!document.getElementById('page-list').classList.contains('hidden')) {
                filterList('all');
            }
        }

        // --- 4. 輔助功能 ---
        function downloadCSV() {
            let csvContent = "\uFEFF店名,分類,地址,筆記\n"; 
            FOOD_DATA.forEach(item => {
                csvContent += `${item.name},${item.cat},${item.addr},${item.note}\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "台南美食清單_更新.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function openGoogleDrive() {
            window.open('https://drive.google.com/', '_blank');
        }

        // --- 介面操作 ---
        function switchTab(tabName) {
            document.querySelectorAll('.page-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(`page-${tabName}`).classList.remove('hidden');
            
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('nav-active', 'text-radar-orange'));
            document.querySelectorAll('nav button').forEach(btn => btn.classList.add('text-gray-400'));
            
            const activeBtn = document.getElementById(`nav-${tabName}`);
            activeBtn.classList.add('nav-active', 'text-radar-orange');
            activeBtn.classList.remove('text-gray-400');

            if (tabName === 'list') filterList('all');
        }

        function searchByCategory(category) {
            const pool = FOOD_DATA.filter(i => i.cat === category);
            if (pool.length > 0) {
                const target = pool[Math.floor(Math.random() * pool.length)];
                openMap(target);
            } else {
                alert("沒有這個分類的資料");
            }
        }

        function pickRandom() {
            if (FOOD_DATA.length === 0) return alert("資料讀取中...");
            const target = FOOD_DATA[Math.floor(Math.random() * FOOD_DATA.length)];
            if(confirm(`命運之神選中了：\n\n🏠 ${target.name}\n📍 ${target.addr}\n\n要去這家嗎？`)) {
                openMap(target);
            }
        }

        function filterList(filterCat) {
            const container = document.getElementById('list-container');
            container.innerHTML = '';
            
            document.querySelectorAll('.filter-btn').forEach(btn => btn.className = "filter-btn px-4 py-1.5 rounded-full text-sm font-bold bg-white text-gray-500 border whitespace-nowrap");
            event.target.className = "filter-btn active px-4 py-1.5 rounded-full text-sm font-bold bg-gray-800 text-white whitespace-nowrap shadow-md";

            const filtered = FOOD_DATA.filter(item => filterCat === 'all' || item.cat === filterCat);
            
            if(filtered.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-400 mt-10">無資料</div>';
                return;
            }

            filtered.forEach((item, index) => {
                let tagColor = "bg-gray-100 text-gray-500";
                if(item.cat === 'healthy') tagColor = "bg-green-100 text-green-600";
                if(item.cat === 'unclass') tagColor = "bg-red-100 text-red-500";
                
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center active:scale-95 transition-transform';
                card.onclick = () => openMap(item);
                
                card.innerHTML = `
                    <div class="flex-1 min-w-0 pr-4">
                        <h3 class="font-bold text-gray-800 truncate text-lg">${item.name}</h3>
                        <p class="text-xs text-gray-400 truncate mt-1">📍 ${item.addr}</p>
                        <div class="mt-2 flex gap-2">
                            <span class="text-[10px] px-2 py-0.5 rounded-full ${tagColor}">${item.cat}</span>
                            ${item.note ? `<span class="text-[10px] px-2 py-0.5 rounded-full bg-yellow-100 text-yellow-600">${item.note}</span>` : ''}
                        </div>
                    </div>
                    <div class="text-2xl text-gray-300">👉</div>
                `;
                container.appendChild(card);
            });
        }

        function openMap(item) {
            window.location.href = `http://maps.google.com/?q=${encodeURIComponent(item.name + " " + item.addr)}`;
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js', { scope: './' })
                    .catch(error => console.warn('Service worker registration failed:', error));
            });
        }
    </script>
</body>
</html>
