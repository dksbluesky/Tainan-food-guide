<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>台南漫遊雷達 | 美食探測器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        display: ['"Fredoka"', 'sans-serif'],
                    },
                    colors: {
                        tainan: {
                            orange: '#FF8C42',
                            yellow: '#FFC857',
                            blue: '#4AD7D1',
                            red: '#FF5A5F',
                            bg: '#FFF9F0'
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .blob {
            position: fixed;
            filter: blur(40px);
            z-index: -1;
            opacity: 0.6;
        }
    </style>
</head>
<body class="bg-tainan-bg text-gray-700 h-screen flex flex-col overflow-hidden relative">

    <div class="blob w-64 h-64 bg-tainan-yellow rounded-full top-[-50px] left-[-50px] animate-float" style="animation-delay: 0s;"></div>
    <div class="blob w-80 h-80 bg-tainan-blue rounded-full bottom-[-80px] right-[-40px] animate-float" style="animation-delay: 2s;"></div>

    <header class="z-20 bg-white/70 backdrop-blur-lg shadow-sm fixed w-full top-0 left-0 px-4 py-3 border-b border-white/50">
        <div class="flex justify-between items-center max-w-2xl mx-auto">
            <div class="flex items-center gap-2">
                <span class="text-3xl filter drop-shadow-sm">📡</span>
                <div>
                    <h1 class="text-2xl font-display font-bold text-transparent bg-clip-text bg-gradient-to-r from-tainan-orange to-tainan-red tracking-wide">Food Radar</h1>
                    <p class="text-[10px] text-gray-500 font-bold bg-white/50 px-2 py-0.5 rounded-full inline-block">台南美食探測</p>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow pt-28 pb-10 px-4 z-10 max-w-2xl mx-auto w-full overflow-y-auto no-scrollbar relative">
        
        <div id="category-view" class="animate-pop">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-1">今天想吃哪一類？</h2>
                <p class="text-gray-500 text-sm">點擊按鈕，自動搜尋附近好料</p>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <button onclick="startRadar('chinese')" class="group bg-white p-6 rounded-2xl shadow-lg shadow-orange-100 hover:shadow-orange-200 border-2 border-transparent hover:border-tainan-orange transition-all duration-200 transform hover:-translate-y-1 active:scale-95">
                    <div class="text-4xl mb-3 group-hover:scale-110 transition-transform">🍜</div>
                    <div class="font-bold text-lg text-gray-700">中式/小吃</div>
                    <div class="text-xs text-gray-400 mt-1">牛肉麵、肉燥飯...</div>
                </button>
                <button onclick="startRadar('western')" class="group bg-white p-6 rounded-2xl shadow-lg shadow-blue-100 hover:shadow-blue-200 border-2 border-transparent hover:border-tainan-blue transition-all duration-200 transform hover:-translate-y-1 active:scale-95">
                    <div class="text-4xl mb-3 group-hover:scale-110 transition-transform">🍔</div>
                    <div class="font-bold text-lg text-gray-700">西式/異國</div>
                    <div class="text-xs text-gray-400 mt-1">早午餐、漢堡...</div>
                </button>
                <button onclick="startRadar('cafe')" class="group bg-white p-6 rounded-2xl shadow-lg shadow-yellow-100 hover:shadow-yellow-200 border-2 border-transparent hover:border-tainan-yellow transition-all duration-200 transform hover:-translate-y-1 active:scale-95">
                    <div class="text-4xl mb-3 group-hover:scale-110 transition-transform">🍰</div>
                    <div class="font-bold text-lg text-gray-700">甜點咖啡</div>
                    <div class="text-xs text-gray-400 mt-1">下午茶、蛋糕...</div>
                </button>
                <button onclick="startRadar('drinks')" class="group bg-white p-6 rounded-2xl shadow-lg shadow-teal-100 hover:shadow-teal-200 border-2 border-transparent hover:border-teal-400 transition-all duration-200 transform hover:-translate-y-1 active:scale-95">
                    <div class="text-4xl mb-3 group-hover:scale-110 transition-transform">🍹</div>
                    <div class="font-bold text-lg text-gray-700">解渴手搖</div>
                    <div class="text-xs text-gray-400 mt-1">飲料店、果汁...</div>
                </button>
                <button onclick="startRadar('late_night')" class="group bg-white p-6 rounded-2xl shadow-lg shadow-purple-100 hover:shadow-purple-200 border-2 border-transparent hover:border-purple-400 transition-all duration-200 transform hover:-translate-y-1 active:scale-95">
                    <div class="text-4xl mb-3 group-hover:scale-110 transition-transform">🍢</div>
                    <div class="font-bold text-lg text-gray-700">宵夜場</div>
                    <div class="text-xs text-gray-400 mt-1">燒烤、鹹酥雞...</div>
                </button>
                <button onclick="startRadar('surprise')" class="group bg-gradient-to-br from-tainan-orange to-tainan-red p-6 rounded-2xl shadow-lg shadow-red-200 hover:shadow-red-300 text-white transition-all duration-200 transform hover:-translate-y-1 active:scale-95">
                    <div class="text-4xl mb-3 animate-pulse">🎲</div>
                    <div class="font-bold text-lg">幫我決定！</div>
                    <div class="text-xs text-white/80 mt-1">隨機抽選</div>
                </button>
            </div>
        </div>

        <div id="loading-view" class="hidden absolute inset-0 bg-tainan-bg z-20 flex flex-col items-center justify-center pt-20">
            <div class="relative w-32 h-32 mb-8">
                <div class="absolute inset-0 border-4 border-tainan-orange/20 rounded-full animate-ping"></div>
                <div class="absolute inset-0 border-4 border-tainan-orange/40 rounded-full" style="animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;"></div>
                <div class="absolute inset-0 flex items-center justify-center text-5xl animate-bounce">📍</div>
            </div>
            <h3 class="text-2xl font-bold text-gray-800 mb-2">正在鎖定你的位置...</h3>
            <p id="loading-text" class="text-tainan-orange font-bold text-lg animate-pulse">搜尋中...</p>
            <p class="text-xs text-gray-400 mt-8 max-w-xs text-center">請允許瀏覽器存取位置，我們將為你導航至最近的 Google Maps 結果。</p>
            
            <button onclick="location.reload()" class="mt-12 text-gray-400 underline text-sm">如果卡住請點此重新整理</button>
        </div>

    </main>

    <script>
        // ==========================================
        // ★ 關鍵字資料庫 (這就是你的「菜單」) ★
        // ==========================================
        const KEYWORDS = {
            'chinese': ['台南 牛肉麵', '台南 肉燥飯', '台南 鱔魚意麵', '台南 鍋燒意麵', '台南 米糕', '台南 虱目魚', '台南 熱炒', '台南 火鍋', '台南 粥'],
            'western': ['台南 漢堡', '台南 義大利麵', '台南 牛排', '台南 披薩', '台南 早午餐', '台南 日式料理', '台南 咖哩', '台南 拉麵'],
            'cafe': ['台南 咖啡廳', '台南 甜點', '台南 蛋糕', '台南 冰店', '台南 豆花', '台南 下午茶'],
            'drinks': ['台南 手搖飲料', '台南 果汁', '台南 紅茶', '台南 綠豆沙'],
            'late_night': ['台南 鹹酥雞', '台南 燒烤', '台南 串燒', '台南 宵夜', '台南 居酒屋']
        };

        // 包含所有類別的總清單，給「幫我決定」用
        const ALL_KEYWORDS = [].concat(...Object.values(KEYWORDS));

        function startRadar(category) {
            // 1. 切換介面到 Loading
            document.getElementById('category-view').classList.add('hidden');
            document.getElementById('loading-view').classList.remove('hidden');

            // 2. 決定關鍵字
            let searchKeyword = '';
            let displayText = '';

            if (category === 'surprise') {
                searchKeyword = ALL_KEYWORDS[Math.floor(Math.random() * ALL_KEYWORDS.length)];
                displayText = `命運選中了... ${searchKeyword.replace('台南 ', '')}！`;
            } else {
                const list = KEYWORDS[category];
                searchKeyword = list[Math.floor(Math.random() * list.length)];
                displayText = `正在搜尋附近的... ${searchKeyword.replace('台南 ', '')}`;
            }

            // 更新畫面上的文字
            document.getElementById('loading-text').innerText = displayText;

            // 3. 取得位置並跳轉
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        
                        // 模擬一點點延遲讓使用者看到動畫 (0.8秒)
                        setTimeout(() => {
                            openGoogleMaps(searchKeyword, lat, lng);
                            // 為了使用者體驗，跳轉後重新整理頁面或還原，這裡選擇 reload 讓使用者回來可以重選
                            setTimeout(() => location.reload(), 1000); 
                        }, 800);
                    },
                    (error) => {
                        // 定位失敗時的備案
                        alert("無法取得位置，將直接搜尋台南市區。");
                        openGoogleMaps(searchKeyword, 22.9997, 120.2270); // 預設台南市中心
                        location.reload();
                    }
                );
            } else {
                alert("你的瀏覽器不支援定位功能。");
                openGoogleMaps(searchKeyword, 22.9997, 120.2270);
            }
        }

        function openGoogleMaps(keyword, lat, lng) {
            // 構建 Google Maps 搜尋網址
            // query: 搜尋關鍵字
            // ll: 鎖定經緯度
            // z: 縮放層級 (15通常是街道等級)
            const url = `https://www.google.com/maps/search/${encodeURIComponent(keyword)}/@${lat},${lng},15z`;
            window.open(url, '_blank'); // 在新分頁開啟
        }
    </script>
</body>
</html>
