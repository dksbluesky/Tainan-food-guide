<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>台南美食雷達 | 家庭共享版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        display: ['"Fredoka"', 'sans-serif'],
                    },
                    colors: {
                        radar: {
                            orange: '#FF8C42',
                            yellow: '#FFC857',
                            blue: '#4AD7D1',
                            red: '#FF5A5F',
                            bg: '#FFF9F0'
                        }
                    },
                    animation: {
                        'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                        'slide-up': 'slideUp 0.3s ease-out',
                    },
                    keyframes: {
                        pop: {
                            '0%': { transform: 'scale(0.9)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .blob { position: fixed; filter: blur(40px); z-index: -1; opacity: 0.6; pointer-events: none; }
        .nav-active { color: #FF8C42; font-weight: bold; }
        .nav-active svg { stroke: #FF8C42; stroke-width: 2.5; }
    </style>
</head>
<body class="bg-radar-bg text-gray-700 h-screen flex flex-col overflow-hidden relative">

    <div class="blob w-64 h-64 bg-radar-yellow rounded-full top-[-50px] left-[-50px]"></div>
    <div class="blob w-80 h-80 bg-radar-blue rounded-full bottom-[-80px] right-[-40px]"></div>

    <header class="z-20 bg-white/90 backdrop-blur-md shadow-sm fixed w-full top-0 left-0 px-4 py-3 border-b border-white/50">
        <div class="flex justify-between items-center max-w-2xl mx-auto">
            <div class="flex items-center gap-2" onclick="location.reload()">
                <span class="text-3xl filter drop-shadow-sm">☁️</span>
                <div>
                    <h1 class="text-2xl font-display font-bold text-transparent bg-clip-text bg-gradient-to-r from-radar-orange to-radar-red tracking-wide">Family Food</h1>
                    <p class="text-[10px] text-gray-500 font-bold bg-white/50 px-2 py-0.5 rounded-full inline-block" id="header-status">連線中...</p>
                </div>
            </div>
            <button onclick="fetchDataFromSheet()" class="bg-gray-100 text-gray-500 p-2 rounded-full hover:bg-radar-orange hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
        </div>
    </header>

    <main class="flex-grow pt-24 pb-24 px-4 z-10 max-w-2xl mx-auto w-full overflow-y-auto no-scrollbar relative" id="main-container">
        
        <div id="page-radar" class="page-section animate-pop">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-1">家庭美食雷達</h2>
                <p class="text-gray-500 text-sm">搜尋我們共同的口袋名單</p>
            </div>
            
            <div class="grid grid-cols-2 gap-3 mb-6">
                <button onclick="searchByCategory('chinese')" class="p-4 rounded-2xl bg-white shadow-sm border border-gray-100 hover:border-radar-orange hover:shadow-md transition-all flex flex-col items-center gap-2">
                    <span class="text-4xl">🍜</span><span class="font-bold text-gray-700">中式/小吃</span>
                </button>
                <button onclick="searchByCategory('western')" class="p-4 rounded-2xl bg-white shadow-sm border border-gray-100 hover:border-radar-blue hover:shadow-md transition-all flex flex-col items-center gap-2">
                    <span class="text-4xl">🍔</span><span class="font-bold text-gray-700">西式/異國</span>
                </button>
                <button onclick="searchByCategory('cafe')" class="p-4 rounded-2xl bg-white shadow-sm border border-gray-100 hover:border-radar-yellow hover:shadow-md transition-all flex flex-col items-center gap-2">
                    <span class="text-4xl">🍰</span><span class="font-bold text-gray-700">甜點咖啡</span>
                </button>
                <button onclick="searchByCategory('drinks')" class="p-4 rounded-2xl bg-white shadow-sm border border-gray-100 hover:border-teal-400 hover:shadow-md transition-all flex flex-col items-center gap-2">
                    <span class="text-4xl">🍹</span><span class="font-bold text-gray-700">手搖飲料</span>
                </button>
                <button onclick="searchByCategory('healthy')" class="p-4 rounded-2xl bg-white shadow-sm border border-gray-100 hover:border-green-400 hover:shadow-md transition-all flex flex-col items-center gap-2">
                    <span class="text-4xl">🍱</span><span class="font-bold text-gray-700">健康餐盒</span>
                </button>
                <button onclick="searchByCategory('late_night')" class="p-4 rounded-2xl bg-white shadow-sm border border-gray-100 hover:border-purple-400 hover:shadow-md transition-all flex flex-col items-center gap-2">
                    <span class="text-4xl">🍢</span><span class="font-bold text-gray-700">宵夜燒烤</span>
                </button>
                <button onclick="pickRandom()" class="col-span-2 p-4 rounded-2xl bg-gradient-to-r from-radar-orange to-radar-red text-white shadow-lg hover:shadow-xl transition-all flex justify-center items-center gap-3">
                    <span class="text-3xl animate-bounce">🎲</span>
                    <span class="font-bold text-lg">幫我隨機選一家！</span>
                </button>
            </div>
        </div>

        <div id="page-list" class="page-section hidden animate-slide-up">
            <div class="flex items-center justify-between mb-4 sticky top-0 bg-radar-bg/95 py-2 z-10 backdrop-blur">
                <h2 class="text-xl font-bold text-gray-800">所有店家</h2>
                <span class="text-xs bg-gray-200 text-gray-600 px-2 py-1 rounded-full" id="total-count">0 間</span>
            </div>

            <div class="flex gap-2 overflow-x-auto no-scrollbar mb-4 pb-2">
                <button onclick="filterList('all')" class="filter-btn active px-4 py-1.5 rounded-full text-sm font-bold bg-gray-800 text-white whitespace-nowrap">全部</button>
                <button onclick="filterList('chinese')" class="filter-btn px-4 py-1.5 rounded-full text-sm font-bold bg-white text-gray-500 border whitespace-nowrap">🍜 中式</button>
                <button onclick="filterList('western')" class="filter-btn px-4 py-1.5 rounded-full text-sm font-bold bg-white text-gray-500 border whitespace-nowrap">🍔 西式</button>
                <button onclick="filterList('cafe')" class="filter-btn px-4 py-1.5 rounded-full text-sm font-bold bg-white text-gray-500 border whitespace-nowrap">🍰 甜點</button>
                <button onclick="filterList('healthy')" class="filter-btn px-4 py-1.5 rounded-full text-sm font-bold bg-white text-gray-500 border whitespace-nowrap">🍱 健康</button>
                <button onclick="filterList('late_night')" class="filter-btn px-4 py-1.5 rounded-full text-sm font-bold bg-white text-gray-500 border whitespace-nowrap">🍢 宵夜</button>
            </div>

            <div id="list-container" class="space-y-3 pb-20"></div>
        </div>

    </main>

    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 z-30 pb-safe">
        <div class="max-w-2xl mx-auto flex justify-around items-center h-16">
            <button onclick="switchTab('radar')" id="nav-radar" class="nav-active flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-radar-orange transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span class="text-[10px]">美食雷達</span>
            </button>
            <button onclick="switchTab('list')" id="nav-list" class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-radar-orange transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
                </svg>
                <span class="text-[10px]">口袋清單</span>
            </button>
        </div>
    </nav>

    <script>
        // =========================================================
        // ★ 請在下方貼上您的 Google Sheet CSV 連結 ★
        // =========================================================
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQXPhZ5z3CHn6oemAKkuUuDskGkk6CLfbfNws0s2QL2UQTo6TOIP9kzuOqx5vB8hU_SXF_-ObxsK0h0/pub?output=csv'; 
        // 例如：'https://docs.google.com/spreadsheets/d/e/2PACX-.../pub?output=csv'
        // =========================================================

        let FOOD_DATA = [];

        window.onload = function() {
            if (SHEET_URL.includes('PASTE_YOUR')) {
                alert("請記得修改程式碼，貼上您的 Google Sheet 連結喔！");
                document.getElementById('header-status').innerText = "尚未設定連結";
            } else {
                fetchDataFromSheet();
            }
        };

        async function fetchDataFromSheet() {
            document.getElementById('header-status').innerText = "更新資料中...";
            try {
                // 加個時間戳記避免快取
                const response = await fetch(SHEET_URL + "&t=" + new Date().getTime());
                const csvText = await response.text();
                parseCSV(csvText);
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('header-status').innerText = "連線失敗";
                alert("無法讀取 Google Sheet，請確認：\n1. 網址是否正確\n2. 是否已發布為 CSV 格式");
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n');
            const result = [];
            // 跳過標題列 (i=1)
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                // 簡易 CSV 解析 (處理逗號)
                // 假設沒有引號包覆的複雜狀況
                const parts = line.split(',');
                if (parts.length >= 2) {
                    result.push({
                        name: parts[0].trim(),
                        cat: parts[1] ? parts[1].trim() : 'unclass',
                        addr: parts[2] ? parts[2].trim() : '台南市',
                        note: parts[3] ? parts[3].trim() : ''
                    });
                }
            }
            FOOD_DATA = result;
            document.getElementById('header-status').innerText = `雲端同步：${FOOD_DATA.length} 間`;
            document.getElementById('total-count').innerText = `${FOOD_DATA.length} 間`;
            // 如果剛打開且有資料，刷新列表
            filterList('all');
        }

        // --- 介面功能 (與之前相同) ---
        function switchTab(tabName) {
            document.querySelectorAll('.page-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(`page-${tabName}`).classList.remove('hidden');
            
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('nav-active', 'text-radar-orange'));
            document.querySelectorAll('nav button').forEach(btn => btn.classList.add('text-gray-400'));
            
            const activeBtn = document.getElementById(`nav-${tabName}`);
            activeBtn.classList.add('nav-active', 'text-radar-orange');
            activeBtn.classList.remove('text-gray-400');

            if (tabName === 'list') filterList('all');
        }

        function searchByCategory(category) {
            const pool = FOOD_DATA.filter(i => i.cat === category);
            if (pool.length > 0) {
                const target = pool[Math.floor(Math.random() * pool.length)];
                openMap(target);
            } else {
                alert("口袋名單裡還沒有這個分類的資料，先去 Google Sheet 新增吧！");
            }
        }

        function pickRandom() {
            if (FOOD_DATA.length === 0) return alert("資料讀取中...");
            const target = FOOD_DATA[Math.floor(Math.random() * FOOD_DATA.length)];
            if(confirm(`命運之神選中了：\n\n🏠 ${target.name}\n📍 ${target.addr}\n\n要去這家嗎？`)) {
                openMap(target);
            }
        }

        function filterList(filterCat) {
            const container = document.getElementById('list-container');
            container.innerHTML = '';
            
            document.querySelectorAll('.filter-btn').forEach(btn => btn.className = "filter-btn px-4 py-1.5 rounded-full text-sm font-bold bg-white text-gray-500 border whitespace-nowrap");
            event.target.className = "filter-btn active px-4 py-1.5 rounded-full text-sm font-bold bg-gray-800 text-white whitespace-nowrap shadow-md";

            const filtered = FOOD_DATA.filter(item => filterCat === 'all' || item.cat === filterCat);
            
            filtered.forEach((item, index) => {
                let tagColor = "bg-gray-100 text-gray-500";
                if(item.cat === 'healthy') tagColor = "bg-green-100 text-green-600";
                
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center active:scale-95 transition-transform';
                card.onclick = () => openMap(item);
                
                card.innerHTML = `
                    <div class="flex-1 min-w-0 pr-4">
                        <h3 class="font-bold text-gray-800 truncate text-lg">${item.name}</h3>
                        <p class="text-xs text-gray-400 truncate mt-1">📍 ${item.addr}</p>
                        <div class="mt-2 flex gap-2">
                            <span class="text-[10px] px-2 py-0.5 rounded-full ${tagColor}">${item.cat}</span>
                            ${item.note ? `<span class="text-[10px] px-2 py-0.5 rounded-full bg-yellow-100 text-yellow-600">${item.note}</span>` : ''}
                        </div>
                    </div>
                    <div class="text-2xl text-gray-300">👉</div>
                `;
                container.appendChild(card);
            });
        }

        function openMap(item) {
            window.location.href = `http://maps.google.com/?q=${encodeURIComponent(item.name + " " + item.addr)}`;
        }
    </script>
</body>
</html>
